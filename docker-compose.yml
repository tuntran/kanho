services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      KANHO_DATABASE_URL: postgres://kanho:kanho@postgres:5432/kanho?sslmode=disable
      KANHO_STORAGE_ENDPOINT: minio:9000
      KANHO_STORAGE_ACCESS_KEY: minioadmin
      KANHO_STORAGE_SECRET_KEY: minioadmin
      KANHO_STORAGE_BUCKET: kanho
      KANHO_STORAGE_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}/kanho
      KANHO_JWT_SECRET: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanho
      POSTGRES_PASSWORD: kanho
      POSTGRES_DB: kanho
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanho"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CORS_ALLOW_ORIGIN: "*"
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-time init: create bucket and set public read policy
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/$${KANHO_STORAGE_BUCKET:-kanho} &&
        mc anonymous set download local/$${KANHO_STORAGE_BUCKET:-kanho} &&
        echo 'minio-init: bucket ready'
      "
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
